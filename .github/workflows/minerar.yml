name: Minerar ofertas

on:
  schedule:
    - cron: '0 7 * * *'   # todo dia às 4h da manhã (horário de Brasília)
  workflow_dispatch:
    inputs:
      teste:
        description: 'Rodada curta de teste'
        type: boolean
        default: false
      so_capas:
        description: 'Só baixar as capas (sem minerar)'
        type: boolean
        default: false
      busca:
        description: 'Busca sob demanda: termo a pesquisar (vazio = mineração normal)'
        type: string
        default: ''
      paises:
        description: 'Países da busca (BR, MX ou BR,MX)'
        type: string
        default: 'BR'
      busca_id:
        description: 'Código da busca no app'
        type: string
        default: ''
  push:
    branches: [main]
    paths: ['minerar.mjs', 'config.json', '.github/workflows/minerar.yml']

permissions:
  contents: write
  id-token: write   # identificação do GitHub pro app da VK aceitar os dados (sem chave guardada)

concurrency: minerar

jobs:
  minerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
        if: ${{ inputs.so_capas != true }}
      - name: Rodar minerador
        if: ${{ inputs.so_capas != true }}
        env:
          BUSCA: ${{ inputs.busca }}
          BUSCA_PAISES: ${{ inputs.paises }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.teste }}" = "true" ]; then
            node minerar.mjs --teste
          else
            node minerar.mjs
          fi
      - name: Baixar capas dos anúncios
        env:
          BUSCA_ID: ${{ inputs.busca_id }}
        run: node capas.mjs
      - name: Montar pacote do app
        run: node visual/montar.mjs --painel
      - name: Enviar pro app da VK
        env:
          BUSCA_ID: ${{ inputs.busca_id }}
        run: node enviar.mjs
      - name: Salvar resultado
        env:
          BUSCA: ${{ inputs.busca }}
        run: |
          git config user.name "minerador-bot"
          git config user.email "minerador-bot@users.noreply.github.com"
          git add data/
          if [ -n "$BUSCA" ]; then MSG="Busca: $BUSCA"; else MSG="Mineração"; fi
          git diff --cached --quiet || git commit -m "$MSG $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
